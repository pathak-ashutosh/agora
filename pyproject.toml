[project]
name = "agora-data-prep"
version = "0.1.0"
description = "Convert raw caucus CSVs to Parquet for the agora web app"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "networkx>=3.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "umap-learn>=0.5",
    "torch>=2.12.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
]
